name: Extract iOS 26 Kernel Offsets

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    steps:
    - name: Clone XNU xnu-12377.121.6
      run: git clone --depth=1 --branch xnu-12377.121.6 https://github.com/apple-oss-distributions/xnu.git xnu

    - name: Upload extractor script
      run: cat extract_offsets.py | python3
      env:
        SCRIPT: "run"

    - name: Run offset extractor
      run: python3 extract_offsets.py

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: ios26-kernel-offsets
        path: ios26_offsets.txt
