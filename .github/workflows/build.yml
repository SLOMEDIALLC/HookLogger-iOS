name: Build HookLogger iOS dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show SDK info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || echo "No iOS SDK"
          xcrun --sdk macosx --show-sdk-version

      - name: Build dylib
        run: |
          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -arch arm64 \
            -fobjc-arc \
            -framework Foundation \
            -miphoneos-version-min=12.0 \
            -install_name @rpath/HookLogger.framework/HookLogger \
            -o HookLogger.dylib \
            HookLogger.m
          file HookLogger.dylib
          ls -lh HookLogger.dylib

      - name: Sign dylib with ldid
        run: |
          brew install ldid || true
          ldid -S HookLogger.dylib
          echo "Signed OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HookLogger-dylib
          path: HookLogger.dylib
