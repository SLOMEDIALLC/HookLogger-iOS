name: Build HookLogger iOS dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build HookLogger.dylib
        run: |
          # 使用 xcrun clang 确保正确的工具链
          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -arch arm64 \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -miphoneos-version-min=12.0 \
            -install_name @rpath/HookLogger.framework/HookLogger \
            -o HookLogger.dylib \
            HookLogger.m
          file HookLogger.dylib
          ls -lh HookLogger.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: HookLogger-dylib
          path: HookLogger.dylib
